<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Careers · Naveria Space</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preload" as="font" href="../fonts/NevanRUS.woff2" type="font/woff2" crossorigin>
<link rel="stylesheet" href="careers.css">
</head>
<body>
<nav>
  <a href="../" class="nav-logo">
    <span class="nav-logo-text"><span class="nav-logo-naveria">Naveria</span><span class="nav-logo-space">Space</span></span>
  </a>
  <ul class="nav-links">
    <li><a href="../#work">Work</a></li>
    <li><a href="../#team">Team</a></li>
    <li class="nav-priority"><a href="./" class="is-active">Careers</a></li>
    <li class="nav-priority"><a href="https://cal.com/naveria.space" target="_blank" class="nav-cta">Book a call</a></li>
  </ul>
  <button type="button" class="nav-toggle" aria-label="Open menu" aria-expanded="false">
    <span></span><span></span>
  </button>
</nav>

<main class="page" id="careers-root">
  <div class="section-label">Careers</div>
  <h1 class="page-title">Open roles</h1>
  <p class="page-intro">Loading listings…</p>
</main>

<footer>
  <div class="footer-logo"><span class="fl-naveria">Naveria</span><span class="fl-space">Space</span></div>
  <div class="footer-copy">© 2026 Naveria Space · <a href="./">Careers</a></div>
</footer>

<script src="careers.js?v=3"></script>
<script>
  NaveriaCareers.loadJobs()
    .then(data => NaveriaCareers.renderListing(document.getElementById('careers-root'), data))
    .catch(() => {
      document.getElementById('careers-root').innerHTML =
        '<div class="jd-missing"><h1>Could not load roles</h1><p>Refresh, or write to ved@naveria.space.</p></div>';
    });
</script>
</body>
</html>
